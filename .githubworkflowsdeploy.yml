name: Deploy Vite to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./publish-riwi-portafolio # <-- Cambia esto si tu carpeta es ./portafolio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build -- --base=/Riwi_portafolio/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./publish-riwi-portafolio/dist # <-- Asegúrate de que coincida con tu carpeta

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
